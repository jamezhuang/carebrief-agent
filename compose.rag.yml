services:
  rag-db:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_DB: carebrief_rag
      POSTGRES_USER: carebrief
      POSTGRES_PASSWORD: ${RAG_POSTGRES_PASSWORD:?请在apps/api/.env设置RAG_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - carebrief_rag_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carebrief -d carebrief_rag"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  carebrief_rag_pgdata:
