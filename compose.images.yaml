services:
  api:
    image: ghcr.io/jamezhuang/carebrief-api:0.1.0
    ports: !override
      - "127.0.0.1:18000:8000"
    environment:
      CORS_ORIGINS: http://127.0.0.1:3100,http://localhost:3100
  web:
    image: ghcr.io/jamezhuang/carebrief-web:0.1.0
    ports: !override
      - "127.0.0.1:3100:3000"
